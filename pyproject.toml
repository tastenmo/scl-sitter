# pyproject.toml

## CHANGE: The project is now defined using the standard `[project]` table (PEP 621)
## instead of the Poetry-specific `[tool.poetry]` table. This is more universal.
[project]
name = "scl-sitter"
version = "0.1.0"
description = "An advanced SCL parser and tag resolver using tree-sitter, with an integrated GUI."
authors = [
    {name = "Martin Heubuch", email = "martin.heubuch@spie-escad.de"}
]
readme = "README.md"
requires-python = ">=3.10"

# Dependencies for the library to run.
dependencies = [
    "tree-sitter>=0.21.0"
]

## CHANGE: The entry point for the GUI is now correctly defined.
## This creates the 'scl-sitter-gui' command when the package is installed.
[project.scripts]
scl-sitter-gui = "scl_sitter.gui:main"


## CHANGE: The build system is explicitly set to use `setuptools`.
## This is the most reliable backend for building Python packages with C extensions,
## which is exactly what this project is.
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"