[project]
name = "scl-sitter"
version = "0.1.0"
description = "SCL parser for parsing Siemens SCL code using tree-sitter"
authors = [
    {name = "Martin Heubuch",email = "martin.heubuch@spie-escad.de"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter (>=0.25.2,<0.26.0)",
    "tree-sitter-scl @ file:///C:/projects/tree-sitter/tree-sitter-scl"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-mock = "^3.15.1"
pytest-cov = "^7.0.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests that require GUI components",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

